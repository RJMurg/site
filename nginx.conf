server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Prevent nginx from 301-redirecting /foo -> /foo/
    absolute_redirect off;

    # SvelteKit immutable hashed assets (/_app/immutable/*) — cache 1 year
    location ^~ /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Other static assets — cache 30 days
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Pages — serve file, then /path/index.html, else 404 (no trailing-slash redirect)
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}